name: Swedish Radar tests

on:
  push:
    paths:
      - "swedish_radar/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/swedish-radar-tests.yml"
  pull_request:
    paths:
      - "swedish_radar/**"
      - "tests/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        # No dependencies to install - the app and its tests are standard library only.
        run: python -m unittest discover -s tests -t . -v

      - name: Check the CLI starts and the reference data loads
        run: |
          python -m swedish_radar doctor || true   # exits 1 without credentials, which is expected
          python -m swedish_radar labels list | tail -1
          python -m swedish_radar labels check "Adrian Recordings" "Universal Music AB"
